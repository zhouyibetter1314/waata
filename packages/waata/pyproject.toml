[project]
name = "waata"
version = "0.1.0"
description = "Web App Auto Test Agent"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx",
    "pydantic>=2",
]

[project.optional-dependencies]
browser = ["playwright"]
observability = ["langfuse>=4.7,<5"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
