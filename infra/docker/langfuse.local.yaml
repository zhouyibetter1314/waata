services:
  langfuse-web:
    image: docker.langfuse.com/langfuse/langfuse:4.30.0
    ports: !override
      - "127.0.0.1:13038:3000"
  langfuse-worker:
    image: docker.langfuse.com/langfuse/langfuse-worker:4.30.0
    ports: !reset []
  minio:
    ports: !override
      - "127.0.0.1:9090:9000"
  postgres:
    ports: !reset []
  redis:
    ports: !reset []
  clickhouse:
    ports: !reset []
