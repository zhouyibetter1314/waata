default_install_hook_types: [pre-commit, commit-msg]
default_stages: [pre-commit]

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.14.14
    hooks:
      - id: ruff-check
        args: [--config, pyproject.toml, --fix]
      - id: ruff-format
        args: [--config, pyproject.toml]

  - repo: local
    hooks:
      - id: prettier-web
        name: prettier format (apps/web)
        language: node
        entry: prettier
        args: [--config, apps/web/.prettierrc.json, --write]
        additional_dependencies: [prettier@3.8.1]
        files: '^apps/web/.*\.(vue|[cm]?[jt]s|[jt]sx|css|scss|less|html|json)$'
        exclude: '^apps/web/package-lock\.json$'

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: end-of-file-fixer
        # An SSE frame, including the last one, ends with a blank line.
        exclude: '\.sse$'
      - id: check-json
      - id: check-toml
      - id: check-yaml
      - id: check-merge-conflict
        args: [--assume-in-merge]
      - id: detect-private-key

  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v4.3.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
        args: [feat, fix, docs, style, refactor, perf, test, build, ci, chore, revert]
